<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>VELORA — Space Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   VELORA — Space Canvas
   A wellness project composed on its real floor plan, priced live.
   ============================================================ */
:root {
  --carbon: #1C1C1C; --panel: #212123; --panel-2: #262628; --gunmetal: #404140;
  --olive: #91928D; --amber: #C2A36B; --danger: #D0806C;
  --w90: rgba(255,255,255,.9); --w70: rgba(255,255,255,.7); --w50: rgba(255,255,255,.5);
  --w40: rgba(255,255,255,.4); --w30: rgba(255,255,255,.3); --w20: rgba(255,255,255,.2);
  --w10: rgba(255,255,255,.1); --w06: rgba(255,255,255,.06);
  --ease: cubic-bezier(.22,1,.36,1);
  --bar: 64px;
}
* { box-sizing: border-box; border-radius: 0; }
html, body { height: 100%; }
body { margin: 0; background: var(--carbon); color: #fff; font-family: Montserrat, system-ui, sans-serif; font-size: 13px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 1px solid var(--olive); outline-offset: 2px; }
.label { font-size: 9px; letter-spacing: .3em; text-transform: uppercase; color: var(--w40); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--w50); }
.ico { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

/* ---------- Top bar ---------- */
.bar { height: var(--bar); display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 28px; padding: 0 22px; border-bottom: 1px solid var(--w06); background: #1a1a1b; }
.brand { display: flex; align-items: baseline; gap: 16px; }
.wordmark { font-size: 14px; font-weight: 600; letter-spacing: .55em; }
.crumb { font-size: 9px; letter-spacing: .34em; text-transform: uppercase; color: var(--olive); }
.est { justify-self: center; display: flex; align-items: baseline; gap: 16px; }
.est b { font-weight: 200; font-size: 22px; letter-spacing: .02em; white-space: nowrap; }
.est b small { font-size: 10px; color: var(--w40); margin-right: 6px; letter-spacing: .14em; }
.est .meta { font-size: 11px; color: var(--w50); }
.bar-actions { display: flex; align-items: center; gap: 10px; }
.sample { font-size: 8px; letter-spacing: .26em; text-transform: uppercase; color: var(--amber); border: 1px solid rgba(194,163,107,.4); padding: 5px 9px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; font-size: 9px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; border: 1px solid transparent; background: none; transition: all .3s; color: #fff; text-decoration: none; white-space: nowrap; }
.btn-primary { background: var(--olive); color: var(--carbon); }
.btn-primary:hover { background: #fff; }
.btn-ghost { border-color: var(--gunmetal); color: var(--w70); }
.btn-ghost:hover { border-color: var(--olive); color: #fff; }
.btn-danger { border-color: rgba(208,128,108,.4); color: var(--danger); }
.btn-danger:hover { background: rgba(208,128,108,.12); }
.btn[disabled] { opacity: .35; pointer-events: none; }

/* ---------- App frame ---------- */
.app { height: calc(100vh - var(--bar)); display: grid; grid-template-columns: 286px minmax(0,1fr) 372px; }
.library, .inspector { background: var(--panel); overflow: auto; }
.library { border-right: 1px solid var(--w06); }
.inspector { border-left: 1px solid var(--w06); }

/* ---------- Library ---------- */
.tabs { position: sticky; top: 0; z-index: 2; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--panel); border-bottom: 1px solid var(--w06); }
.tabs button { position: relative; padding: 15px 8px; background: none; border: 0; font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--w50); }
.tabs button[aria-selected="true"] { color: #fff; }
.tabs button::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--olive); transform: scaleX(0); transition: transform .4s var(--ease); }
.tabs button[aria-selected="true"]::after { transform: scaleX(1); }
.tabs .count { margin-left: 6px; color: var(--olive); }
.lib-group { padding: 16px 14px 4px; }
.lib-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
.tile { position: relative; display: grid; gap: 6px; align-content: start; min-height: 86px; padding: 11px 10px 10px; text-align: left; background: var(--panel-2); border: 1px solid var(--w06); transition: border-color .25s, transform .25s; }
.tile:hover { border-color: var(--w20); transform: translateY(-1px); }
.tile:active { transform: translateY(1px); }
.tile .nm { font-size: 11px; line-height: 1.3; color: var(--w90); }
.tile .meta { font-size: 9px; color: var(--w40); }
.tile .have { position: absolute; top: 8px; right: 8px; min-width: 16px; height: 16px; padding: 0 4px; display: grid; place-items: center; font-size: 9px; background: var(--olive); color: var(--carbon); }
.tile .forgot { position: absolute; top: 9px; right: 9px; width: 6px; height: 6px; background: var(--amber); }
.lib-foot { padding: 14px; font-size: 10px; color: var(--w40); line-height: 1.6; }
.tile.has-img { padding-top: 0; overflow: hidden; }
.tile-img { display: block; height: 58px; margin: 0 -10px 4px; background: #333 center/cover no-repeat; }
.contents { display: grid; gap: 4px; }
.ct-row { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 6px; background: var(--panel-2); border: 1px solid var(--w06); transition: opacity .2s; }
.ct-row.off { opacity: .5; }
.ct-img { width: 34px; height: 34px; background: #333 center/cover no-repeat; }
.ct-mono { display: grid; place-items: center; color: var(--w70); font-size: 11px; background: var(--gunmetal); }
.ct-name b { display: block; font-weight: 400; font-size: 11px; color: var(--w90); }
.ct-name small { display: block; font-size: 10px; color: var(--w40); }
.ct-tag { font-size: 8px; letter-spacing: .2em; text-transform: uppercase; color: var(--olive); }
.ct-switch { position: relative; width: 32px; height: 18px; border: 1px solid var(--w30); background: none; }
.ct-switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 10px; height: 10px; background: var(--w50); transition: transform .25s var(--ease), background .25s; }
.ct-switch[aria-checked="true"] { border-color: var(--olive); }
.ct-switch[aria-checked="true"]::after { transform: translateX(14px); background: var(--olive); }
.ct-warn { margin: 8px 0 0; font-size: 11px; line-height: 1.5; color: var(--amber); }
.lib-foot i { display: inline-block; width: 6px; height: 6px; background: var(--amber); margin-right: 6px; }

/* ---------- Stage ---------- */
.stage { position: relative; display: grid; grid-template-rows: minmax(0,1fr) auto; min-width: 0; overflow: hidden; background: radial-gradient(110% 80% at 50% 20%, #29292c 0%, #1b1b1c 70%); }
.model { position: relative; min-height: 0; overflow: hidden; cursor: grab; touch-action: none; user-select: none; }
.model.dragging { cursor: grabbing; }
.model.edit { cursor: default; }
.model.marking { cursor: crosshair; }
.model > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.model .hit { fill: transparent; cursor: pointer; transition: fill .25s; }
.model.edit .hit { cursor: move; }
.model .hit:hover { fill: rgba(255,255,255,.06); }
.model .sel { fill: rgba(145,146,141,.12); stroke: #d9dad4; stroke-dasharray: .35 .25; animation: march 1.2s linear infinite; pointer-events: none; }
.model .bad { fill: rgba(208,128,108,.14); stroke: #d0806c; stroke-dasharray: .3 .2; animation: march 1.2s linear infinite; pointer-events: none; }
@keyframes march { to { stroke-dashoffset: -1.2; } }
.model .ripple { stroke-dasharray: 1.2 .8; animation: ripple 3.2s linear infinite; }
@keyframes ripple { to { stroke-dashoffset: -4; } }
.model .flame { animation: flame 1.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center bottom; }
@keyframes flame { to { opacity: .55; transform: scale(1.08, .92); } }
.model .handle { cursor: nwse-resize; }
.model .handle-ew { cursor: ew-resize; }
.model .handle-ns { cursor: ns-resize; }
.model [data-wall], .model [data-pillar], .model [data-window] { cursor: pointer; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--w40); font-size: 12px; pointer-events: none; }
.toolbar { position: absolute; left: 18px; top: 16px; right: 18px; display: flex; flex-wrap: wrap; gap: 6px; z-index: 3; pointer-events: none; }
.toolbar > * { pointer-events: auto; }
.tool { height: 34px; min-width: 34px; padding: 0 11px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: rgba(28,28,28,.82); border: 1px solid var(--w10); color: var(--w70); font-size: 9px; letter-spacing: .2em; text-transform: uppercase; backdrop-filter: blur(6px); transition: all .25s; }
.tool:hover { border-color: var(--olive); color: #fff; }
.tool[aria-pressed="true"] { background: var(--olive); border-color: var(--olive); color: var(--carbon); }
.tool .ico { width: 16px; height: 16px; }
.tool.primary { border-color: rgba(145,146,141,.6); color: #fff; }
.modes { display: inline-flex; border: 1px solid var(--w10); background: rgba(28,28,28,.82); backdrop-filter: blur(6px); }
.modes button { height: 32px; padding: 0 13px; border: 0; background: none; font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--w50); transition: all .25s; }
.modes button[aria-pressed="true"] { background: var(--olive); color: var(--carbon); }
.legend { position: absolute; right: 18px; bottom: 14px; z-index: 3; text-align: right; font-size: 10px; color: var(--w50); line-height: 1.7; pointer-events: none; }
.legend b { font-weight: 400; color: var(--w90); }
.mode-hint { position: absolute; left: 18px; top: 60px; z-index: 3; max-width: 440px; padding: 8px 12px; font-size: 11px; line-height: 1.5; color: var(--w90); background: rgba(28,28,28,.86); border-left: 2px solid var(--olive); backdrop-filter: blur(6px); pointer-events: none; transition: opacity .3s; }
.mode-hint:empty { opacity: 0; }
.hint { position: absolute; left: 18px; bottom: 14px; z-index: 3; font-size: 9px; letter-spacing: .24em; text-transform: uppercase; color: var(--w30); pointer-events: none; }

/* Breakdown strip */
.breakdown { border-top: 1px solid var(--w06); background: rgba(26,26,27,.92); }
.bd-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 22px; align-items: center; padding: 14px 22px; }
.bd-bar { display: flex; height: 8px; background: var(--w06); overflow: hidden; }
.bd-bar span { height: 100%; transition: flex-basis .6s var(--ease); }
.bd-groups { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 11px; color: var(--w70); }
.bd-groups span { display: inline-flex; align-items: center; gap: 7px; }
.bd-groups i { width: 7px; height: 7px; }
.bd-groups b { font-weight: 400; color: #fff; }
.itemised { max-height: 280px; overflow: auto; border-top: 1px solid var(--w06); padding: 6px 22px 16px; }
.itemised table { width: 100%; border-collapse: collapse; font-size: 11px; }
.itemised th { text-align: left; font-weight: 400; font-size: 8px; letter-spacing: .26em; text-transform: uppercase; color: var(--w40); padding: 10px 8px 8px 0; border-bottom: 1px solid var(--w10); }
.itemised td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--w06); color: var(--w70); }
.itemised td.r, .itemised th.r { text-align: right; }
.itemised tr.sub td { color: var(--w90); font-weight: 500; }

/* ---------- Inspector ---------- */
.insp-body { padding: 18px 18px 28px; animation: rise .35s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.insp-head { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; }
.insp-head .ico { width: 26px; height: 26px; color: var(--olive); margin-top: 2px; }
.insp-head h2 { margin: 0; font-weight: 300; font-size: 17px; letter-spacing: .1em; text-transform: uppercase; line-height: 1.2; }
.insp-head p { margin: 5px 0 0; font-size: 11px; color: var(--w50); }
.intro { margin: 0; font-size: 12px; line-height: 1.7; color: var(--w70); }
.section { margin-top: 22px; }
.section > .label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.size { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
.size output { font-size: 20px; font-weight: 200; min-width: 92px; text-align: right; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--gunmetal); }
.stepper button { width: 26px; height: 26px; background: none; border: 0; color: var(--w70); font-size: 14px; }
.stepper button:hover { background: var(--w06); color: #fff; }
.stepper span { min-width: 22px; text-align: center; font-size: 11px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--w20); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -7px; background: var(--olive); border: 2px solid var(--carbon); box-shadow: 0 0 0 1px var(--olive); }
input[type=range]::-moz-range-track { height: 1px; background: var(--w20); }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; background: var(--olive); border: 2px solid var(--carbon); }
input[type=text] { width: 100%; padding: 9px 10px; background: var(--panel-2); border: 1px solid var(--gunmetal); font-size: 12px; }
input[type=text]:focus { outline: none; border-color: var(--olive); }

.swatches { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
.swatch { display: grid; gap: 5px; padding: 0 0 6px; text-align: left; background: none; border: 1px solid var(--w06); transition: border-color .2s; }
.swatch:hover { border-color: var(--w30); }
.swatch[aria-pressed="true"] { border-color: var(--olive); box-shadow: inset 0 0 0 1px var(--olive); }
.swatch .img { position: relative; display: block; aspect-ratio: 1; background: #333 center/cover no-repeat; overflow: hidden; }
.swatch .nm { padding: 0 6px; font-size: 9px; line-height: 1.3; color: var(--w70); }
.swatch .pr { padding: 0 6px; font-size: 8px; color: var(--w40); }
.swatch[aria-pressed="true"] .nm { color: #fff; }
.slats::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 9%, rgba(0,0,0,.6) 9% 11%); }
.baffles::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent 0 12%, rgba(0,0,0,.55) 12% 17%); }
.mat-mirror { background-image: linear-gradient(115deg, rgba(255,255,255,.45), rgba(255,255,255,0) 40%, rgba(255,255,255,.25) 70%), linear-gradient(160deg, #6f777e, #c9d0d5 45%, #7c848a) !important; }
.mat-stretch { background-image: linear-gradient(180deg, #f6f6f4, #c9c9c4 70%, #e8e8e5) !important; }
.view-img { background-image: var(--room); background-size: cover; background-position: center; }
.view-img::after { content: ''; position: absolute; inset: 0; }
.g-none::after { background: url(materials/plaster.jpg) center/cover; }
.g-clear::after { background: linear-gradient(135deg, rgba(190,222,228,.18), rgba(190,222,228,.04)); box-shadow: inset 2px 0 0 rgba(255,255,255,.45); }
.g-frameless::after { background: linear-gradient(115deg, transparent 0 46%, rgba(255,255,255,.35) 47%, transparent 50%); }
.g-fluted::after { backdrop-filter: blur(2.5px); background: repeating-linear-gradient(90deg, rgba(255,255,255,.2) 0 3px, rgba(0,0,0,.14) 3px 6px); }
.g-smart::after { backdrop-filter: blur(7px); background: rgba(240,240,236,.45); clip-path: inset(0 0 0 45%); }
.g-bronze::after { background: rgba(126,86,46,.42); box-shadow: inset 0 0 0 1px rgba(255,220,180,.25); }
.l-even { filter: brightness(1.25) saturate(.7); }
.l-even::after { background: rgba(255,255,255,.08); }
.l-layered { filter: brightness(.8); }
.l-layered::after { background: radial-gradient(circle at 25% 30%, rgba(255,214,160,.55), transparent 32%), radial-gradient(circle at 72% 40%, rgba(255,214,160,.45), transparent 30%), radial-gradient(circle at 50% 85%, rgba(255,214,160,.35), transparent 30%); }
.l-lines { filter: brightness(.55); }
.l-lines::after { background: linear-gradient(180deg, transparent 0 66%, rgba(248,234,210,.5) 66%, #fff4df 67.5%, rgba(248,234,210,.5) 69%, transparent 74%); }
.l-circadian::after { background: linear-gradient(90deg, rgba(255,190,120,.45), rgba(255,255,255,0) 50%, rgba(170,200,255,.45)); }

.features { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.feat { display: grid; grid-template-columns: 20px 1fr auto; gap: 9px; align-items: center; padding: 9px; background: var(--panel-2); border: 1px solid var(--w06); font-size: 11px; color: var(--w90); text-align: left; transition: border-color .2s, background .2s; }
.feat.on { border-color: rgba(145,146,141,.6); background: rgba(145,146,141,.1); }
.feat .ico { width: 18px; height: 18px; color: var(--olive); }
.feat .tick { width: 14px; height: 14px; border: 1px solid var(--w30); display: grid; place-items: center; font-size: 10px; color: var(--carbon); }
.feat.on .tick { background: var(--olive); border-color: var(--olive); }
.feat.on .tick::after { content: '✓'; }
.feat .stepper button { width: 22px; height: 22px; font-size: 12px; }
.cost-card { margin-top: 22px; padding: 14px; background: var(--panel-2); border: 1px solid var(--w06); }
.cost-card b { display: block; margin-top: 4px; font-weight: 200; font-size: 20px; }
.cost-card p { margin: 6px 0 0; font-size: 10px; color: var(--w50); }
.pos { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pos .btn { width: 100%; }
.pos .btn[aria-pressed="true"] { background: var(--olive); color: var(--carbon); border-color: var(--olive); }
.issues { margin-top: 12px; display: grid; gap: 6px; }
.issue { display: flex; gap: 9px; align-items: flex-start; padding: 9px 11px; background: rgba(208,128,108,.08); border: 1px solid rgba(208,128,108,.3); font-size: 11px; line-height: 1.45; color: #f0c2b6; text-align: left; }
.issue::before { content: ''; width: 6px; height: 6px; margin-top: 5px; flex-shrink: 0; background: var(--danger); }
button.issue { width: 100%; cursor: pointer; }
.ok { padding: 9px 11px; font-size: 11px; color: var(--w70); background: rgba(145,146,141,.08); border: 1px solid rgba(145,146,141,.25); }

/* Site tab */
.shapes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.shape { display: grid; gap: 7px; justify-items: center; padding: 10px 4px 8px; background: var(--panel-2); border: 1px solid var(--w06); font-size: 8px; letter-spacing: .16em; text-transform: uppercase; color: var(--w70); transition: border-color .2s; }
.shape svg { width: 34px; height: 26px; }
.shape svg path { fill: rgba(145,146,141,.22); stroke: var(--olive); stroke-width: 1.4; }
.shape[aria-pressed="true"] { border-color: var(--olive); box-shadow: inset 0 0 0 1px var(--olive); color: #fff; }
.dims { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.dim { display: grid; gap: 6px; padding: 9px 10px; background: var(--panel-2); border: 1px solid var(--w06); }
.dim .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.dim b { font-weight: 300; font-size: 15px; }
.tools { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.tool-btn { position: relative; display: grid; gap: 5px; justify-items: center; padding: 11px 2px 9px; background: var(--panel-2); border: 1px solid var(--w06); font-size: 8px; letter-spacing: .08em; text-transform: uppercase; color: var(--w70); transition: all .2s; }
.tool-btn .ico { color: var(--olive); }
.tool-btn[aria-pressed="true"] { border-color: var(--olive); background: rgba(145,146,141,.16); color: #fff; }
.tool-btn .n { position: absolute; top: 5px; right: 6px; font-size: 9px; color: var(--olive); letter-spacing: 0; }
.tool-btn[disabled] { opacity: .35; pointer-events: none; }
.inline { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
.chip { padding: 8px 11px; background: none; border: 1px solid var(--w10); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--w70); transition: all .2s; }
.chip[aria-pressed="true"] { border-color: var(--olive); background: rgba(145,146,141,.14); color: #fff; }
.chip:hover { border-color: var(--w30); }
.meter { position: relative; height: 8px; margin: 10px 0 6px; background: var(--w06); }
.meter .band { position: absolute; top: 0; bottom: 0; background: rgba(145,146,141,.22); }
.meter .val { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #fff; transition: left .5s var(--ease); }
.stat { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--w06); font-size: 12px; color: var(--w70); }
.stat b { font-weight: 400; color: #fff; }

/* Project tab */
.feel-grid { display: grid; gap: 6px; }
.feel { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; padding: 6px; background: var(--panel-2); border: 1px solid var(--w06); text-align: left; transition: border-color .2s; }
.feel .strip { display: grid; grid-template-columns: repeat(3,1fr); height: 48px; }
.feel .strip span { background: center/cover no-repeat; }
.feel b { font-weight: 500; font-size: 10px; letter-spacing: .24em; text-transform: uppercase; }
.feel p { margin: 3px 0 0; font-size: 10px; color: var(--w50); line-height: 1.4; }

   CONTENTS — what each space holds, from the catalog
   ============================================================ */
const PRIORITY_ORDER = { essential: 0, recommended: 1, optional: 2 };
/** How many of an item a space gets: fixed, one per N m², or N per room. Clamped to min…max. */
function itemQty(it, z) {
  const sp = SPACES[z.type], area = sp.by === 'unit' ? z.amount * (sp.foot || 0) : z.amount;
  const n = it.mode === 'fixed' ? it.qty : it.mode === 'per_unit' ? it.qty * z.amount : it.qty > 0 ? Math.round(area / it.qty) : 0;
  return clamp(Math.round(Math.max(0, n)), it.min, it.max);
}
/** Each item of a space with its quantity and whether it's in: essentials always; recommended unless removed; optional when added. */
function contentsOf(z) {

  return sp.items
    .filter((it) => EQUIP[it.equipment])
    .map((it) => {
      const on = it.priority === 'essential' || (z.picks[it.equipment] ?? it.priority === 'recommended');
      return { it, eq: EQUIP[it.equipment], qty: itemQty(it, z), on };

    .sort((a, b) => PRIORITY_ORDER[a.it.priority] - PRIORITY_ORDER[b.it.priority]);

function packRoom(room, items) {

    if (rd > rw && rd > room.d - 2 * WALL && rw <= room.d - 2 * WALL) [rw, rd] = [rd, rw];
    if (x + rw > room.w - WALL && x > WALL) { x = WALL; y += rowD + item.clearance; rowD = 0; }
    if (x + rw > room.w - WALL + 1e-6 || y + rd > room.d - WALL + 1e-6) { left.push(item); continue; }
    placed.push({ ...item, x, y, rw, rd });
    x += rw + item.clearance;

}

function overflowOf(z) {

  if (!r || SPACES[z.type].render !== 'contents') return [];
  const left = packRoom({ w: r.w, d: r.h }, instancesOf(z)).left, n = {};
  left.forEach((i) => (n[i.key] = (n[i.key] || 0) + 1));
  return Object.entries(n).map(([k, c]) => `${c} × ${EQUIP[k].label}`);
}

    });
    // Entrance arrow on the floor.

    const arrow = [[ex + tx * 0.6, ey + ty * 0.6], [ex - tx * 0.6, ey - ty * 0.6], [ex - en.nx * 1.2, ey - en.ny * 1.2]];
    top += `<polygon points="${pts(arrow.map((p) => P(...p, 0.02)))}" fill="#C2A36B"/>`;
    const [lx, ly] = P(en.x + en.nx * 0.7, en.y + en.ny * 0.9, 0.02), fe = 0.3 * sc, tw = fe * 6.4, X = en.nx * cos - en.ny * sin;
    if (flat > 0.9 && Math.abs(X) > 0.7) { // on a side wall of the flat plan the label runs along the wall

    } else {

      top += `<text x="${lx}" y="${ly + fe * 0.35}" font-size="${fe.toFixed(3)}" fill="#C2A36B" text-anchor="${anchor}" letter-spacing="${(0.05 * sc).toFixed(3)}">ENTRANCE</text>`;

    }
  }

  // 4 · Outdoor planting edge on the far sides of the outdoor area.
  const outItems = items.filter((i) => !isIn(i.z));
  if (outItems.length && zf > 0.05) {
    const ox0 = Math.min(...outItems.map((i) => i.r.x)), oy0 = Math.min(...outItems.map((i) => i.r.y)), ox1 = Math.max(...outItems.map((i) => i.r.x + i.r.w)), oy1 = Math.max(...outItems.map((i) => i.r.y + i.r.h)), ocd = depth((ox0 + ox1) / 2, (oy0 + oy1) / 2);
    [[[ox0, oy0], [ox1, oy0]], [[ox1, oy0], [ox1, oy1]], [[ox1, oy1], [ox0, oy1]], [[ox0, oy1], [ox0, oy0]]].forEach(([p, q]) => { if (depth((p[0] + q[0]) / 2, (p[1] + q[1]) / 2) >= ocd) return; addRaw(depth((p[0] + q[0]) / 2, (p[1] + q[1]) / 2) - 0.05, `<polygon points="${pts([P(...p, 0), P(...q, 0), P(...q, 0.9), P(...p, 0.9)])}" fill="${floorPat('lawn')}" stroke="#2f4220" stroke-width="${sw(0.02)}"/><polygon points="${pts([P(...p, 0), P(...q, 0), P(...q, 0.9), P(...p, 0.9)])}" fill="#000" opacity=".25"/>`); });
  }

  // 5 · Editing aids: site dimensions and handles; the wall being drawn; resize handle.
  let aids = '';
  const handle = (x, y, key, cls) => { const [px, py] = P(x, y); aids += `<circle cx="${px}" cy="${py}" r="${sw(0.5)}" fill="transparent" data-handle="${key}" class="${cls}"/><circle cx="${px}" cy="${py}" r="${sw(0.2)}" fill="#ecebe6" stroke="#91928D" stroke-width="${sw(0.06)}" pointer-events="none"/>`; };
  const dimText = (x, y, txt, anchor = 'middle', upright = false) => { const [px, py] = P(x, y); aids += `<text x="${px}" y="${py}"${upright ? ` transform="rotate(-90 ${px} ${py})"` : ''} font-size="${(0.3 * sc).toFixed(3)}" fill="#fff" text-anchor="${anchor}" dominant-baseline="middle" stroke="#1a1a1b" stroke-width="${(0.1 * sc).toFixed(3)}" paint-order="stroke" letter-spacing="${(0.04 * sc).toFixed(3)}">${txt}</text>`; };

    const a = armA(), b = armB(), W = site.W, D = site.D, x0 = snap((W - b) / 2), m = (v) => `${v.toFixed(1)} M`;
    dimText(W / 2, -1.1, m(W)); dimText(A && A.entrance.nx < 0 ? -2 : -1.1, D / 2, m(D), 'middle', true); // clear of an entrance label on the same wall
    if (site.shape !== 'auto' && site.shape !== 'rect') { // the inner edges: the top wing's depth and the side wing's width
      const ax = site.shape === 'L' ? (b + W) / 2 : site.shape === 'U' ? W / 2 : (x0 + b + W) / 2, bx = site.shape === 'T' ? x0 + b : b, by = (a + D) / 2;

    }
    if (site.shape !== 'auto' && state.tool === 'select') {
      handle(W, site.shape === 'rect' ? D / 2 : a / 2, 'W', 'handle-ew');

    }
  }
  if (drag?.kind === 'wall') { aids += `<polyline points="${pts([P(drag.x0, drag.y0), P(drag.x1, drag.y1)])}" stroke="#C2A36B" stroke-width="${sw(0.18)}" fill="none"/>`; const L = Math.hypot(drag.x1 - drag.x0, drag.y1 - drag.y0); if (L >= 0.5) dimText((drag.x0 + drag.x1) / 2 + (drag.x0 === drag.x1 ? 0.9 : 0), (drag.y0 + drag.y1) / 2 - (drag.y0 === drag.y1 ? 0.8 : 0), `${L.toFixed(1)} M`, drag.x0 === drag.x1 ? 'start' : 'middle'); }
  if (mode === 'layout' && zf < 0.05) {
    const z = zoneById(state.sel), r = z && anim.cur.get(z.id);
    if (z && r && isIn(z) && SPACES[z.type].by === 'area') handle(r.x + r.w, r.y + r.h, 'resize', 'handle');
    if (z && r && (drag?.kind === 'move' || drag?.kind === 'resize') && drag.id === z.id) dimText(r.x + r.w / 2, r.y + r.h + 0.8, `${r.w.toFixed(1)} × ${r.h.toFixed(1)} M`);

  // 6 · Labels, kept clear of each other and inside the frame.
  let labels = '';
  if (state.labels && mode !== 'site') {

    [...items].filter((i) => i.r.g > 0.6).sort((a, b) => b.r.w * b.r.h - a.r.w * a.r.h).forEach(({ r, z }) => {
      const name = zoneName(z).toUpperCase(), fs = flat > 0.9 ? clamp(Math.min((r.w * 0.9) / (name.length * 0.9 + 1.4), r.h * 0.24), 0.24 * sc, 0.4 * sc) : clamp(Math.sqrt(r.w * r.h) * 0.075, 0.28 * sc, 0.46 * sc);
      const lift = zf < 0.05 ? 0 : 3.1, [ax, ay] = P(r.x + r.w / 2, r.y + r.h / 2, lift), [zx, zy] = P(r.x + r.w / 2, r.y + r.h / 2, 0.3);
      const w = name.length * fs * 0.9 + fs * 1.4, h = fs * 2.6, rectAt = (x, y) => [x - w / 2, y - fs, x + w / 2, y - fs + h];
      let lx = ax, ly = ay, found = false;
      for (const kk of [0, -1, 1, -2, 2, -3, 3, -4, 4, -5]) { for (const sx of [0, -0.55, 0.55]) { const x = ax + sx * w, y = ay + kk * h * 1.05, rr = rectAt(x, y); if (!hit(rr) && rr[0] > vb.x && rr[2] < vb.x1 && rr[1] > vb.y) { lx = x; ly = y; found = true; break; } } if (found) break; }

/* Site editing helpers */
function addColumnGrid(spacing) {

}

  const m = pt.matrixTransform(svg.getScreenCTM().inverse()), c = Math.cos(proj.ang), s = Math.sin(proj.ang), Y = m.y / proj.k;

(function wireModel() {
  const el = $('#model');

/* ============================================================
   START — a villa wellness wing on a real L-shaped floor, with
   columns, one existing wall and a run of windows
   ============================================================ */
async function loadCatalog() {
  try {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 6000);
    const res = await fetch('/api/space-canvas', { signal: ctl.signal, cache: 'no-store' });
    clearTimeout(timer);
    if (res.ok) applyConfig(await res.json());
  } catch { /* the built-in catalog stays */ }
  warmTextures();
}

(async () => {
await loadCatalog();
Object.assign(state.site, { shape: 'L', W: 26, D: 22, a: 11, b: 11 });
addColumnGrid(8);
state.site.walls.push({ x1: 0, y1: 17, x2: 5, y2: 17 });
state.site.windows.push({ x1: 2, y1: 0, x2: 8, y2: 0 }, { x1: 10, y1: 0, x2: 16, y2: 0 }, { x1: 18, y1: 0, x2: 24, y2: 0 }, { x1: 0, y1: 12, x2: 0, y2: 16 });
[['gym', 70, { planters: 4, screens: 2 }], ['pool', 40, { skylight: 1 }], ['studio', 30, { mirror: 1 }], ['sauna', 1], ['steam', 1], ['plunge', 1], ['lounge', 30, { greenwall: 1 }], ['changing', 25], ['reception', 15], ['plantroom', 12],

  .filter(([t]) => SPACES[t])

})();
